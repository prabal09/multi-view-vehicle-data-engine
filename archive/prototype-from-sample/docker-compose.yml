# Local PostgreSQL for development. Mirrors an RDS for PostgreSQL instance.
# The pgvector image ships the `vector` extension used by detections.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vehicle
      POSTGRES_PASSWORD: vehicle
      POSTGRES_DB: vehicles
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle -d vehicles"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
